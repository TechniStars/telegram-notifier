[project]
name = "telegram-notifier"
version = "0.5.0"
description = "Lightweight Telegram notifications for services: events, warnings, errors with deduplicated tracebacks."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
telegram-notifier-discover = "telegram_notifier.discover:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram_notifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
